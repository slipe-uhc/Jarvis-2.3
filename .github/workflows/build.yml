name: Gerar apps do Jarvis

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abrir o zip (com conserto automatico)
        shell: bash
        run: |
          python - <<'PY'
          import struct, zlib, os
          data = open('jarvis-repo.zip', 'rb').read()
          print('tamanho:', len(data), 'inicio:', data[:4])
          SIG = bytes([0x50, 0x4b, 3, 4])
          i = 0
          n = 0
          while True:
              i = data.find(SIG, i)
              if i < 0:
                  break
              flag, method = struct.unpack('<HH', data[i+6:i+10])
              csize, usize, nlen, elen = struct.unpack('<IIHH', data[i+18:i+30])
              name = data[i+30:i+30+nlen].decode('utf-8', 'replace')
              start = i + 30 + nlen + elen
              raw = data[start:start+csize]
              i = start + csize
              if name.endswith('/'):
                  continue
              out = os.path.join('src', name)
              os.makedirs(os.path.dirname(out) or '.', exist_ok=True)
              body = zlib.decompress(raw, -15) if method == 8 else raw
              open(out, 'wb').write(body)
              n += 1
          print('arquivos extraidos:', n)
          PY
          test -f src/docs/index.html
          test -f src/android/app/build.gradle.kts
          test -f src/pc/package.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Copiar a interface para dentro do app
        run: |
          mkdir -p src/android/app/src/main/assets
          cp src/docs/index.html src/android/app/src/main/assets/index.html

      - name: Compilar APK
        working-directory: src/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp src/android/app/build/outputs/apk/debug/app-debug.apk Jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Jarvis celular v${{ github.run_number }}
          files: Jarvis.apk

  pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abrir o zip (com conserto automatico)
        shell: bash
        run: |
          python - <<'PY'
          import struct, zlib, os
          data = open('jarvis-repo.zip', 'rb').read()
          print('tamanho:', len(data), 'inicio:', data[:4])
          SIG = bytes([0x50, 0x4b, 3, 4])
          i = 0
          n = 0
          while True:
              i = data.find(SIG, i)
              if i < 0:
                  break
              flag, method = struct.unpack('<HH', data[i+6:i+10])
              csize, usize, nlen, elen = struct.unpack('<IIHH', data[i+18:i+30])
              name = data[i+30:i+30+nlen].decode('utf-8', 'replace')
              start = i + 30 + nlen + elen
              raw = data[start:start+csize]
              i = start + csize
              if name.endswith('/'):
                  continue
              out = os.path.join('src', name)
              os.makedirs(os.path.dirname(out) or '.', exist_ok=True)
              body = zlib.decompress(raw, -15) if method == 8 else raw
              open(out, 'wb').write(body)
              n += 1
          print('arquivos extraidos:', n)
          PY
          test -f src/docs/index.html
          test -f src/android/app/build.gradle.kts
          test -f src/pc/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copiar a interface para dentro do app
        shell: bash
        run: |
          mkdir -p src/pc/app
          cp src/docs/index.html src/pc/app/index.html

      - name: Instalar e compilar
        working-directory: src/pc
        shell: bash
        run: |
          npm install
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-PC
          path: src/pc/dist/Jarvis-PC-Setup.exe

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-v${{ github.run_number }}
          name: Jarvis PC v${{ github.run_number }}
          files: src/pc/dist/Jarvis-PC-Setup.exe
